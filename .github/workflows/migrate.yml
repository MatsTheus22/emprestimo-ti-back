name: Migrate database

# ADR-001 §9: migration em deploy roda em job do GitHub Actions,
# antes do deploy. O deploy em si (Vercel) é acionado pela integração
# Vercel<->GitHub, fora deste workflow.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
